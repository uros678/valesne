# valesne with docker compose, using the released image (nothing to build):
#
#   mkdir config        # before the first start, see UID below
#   docker compose up -d
#
# Update: "docker compose pull && docker compose up -d". Optional settings in
# a .env file next to this one:
#
#   PORT  host port for the web page (default 9090); listen_port in the config
#         must stay 9090, it is the port inside the container
#   UID   user the app runs as (default 1000); it must be able to write ./config
#   GID   its group (default 1000)
#   TZ    time zone, e.g. Europe/Berlin (default UTC); used for mute_until,
#         the times in alerts and the log
name: valesne

services:
  valesne:
    # "latest" is the newest release; pin a version (e.g. 0.4) to update
    # only when you choose.
    image: ghcr.io/uros678/valesne:latest
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The Docker check goes through the read-only proxy below, never
      # through docker.sock directly.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Local time for mute_until, the times in alerts and the log (the
      # image has the zone data; without TZ the container runs in UTC).
      TZ: ${TZ:-UTC}
    volumes:
      # A folder, not a single file: editors replace config.toml on save and a
      # single-file bind mount would keep the old file (no hot reload).
      - ./config:/config
    ports:
      - "${PORT:-9090}:9090"
    depends_on:
      - docker-proxy

  # Access to docker.sock is root on the host, and ":ro" does not make the API
  # read-only. The proxy gets the socket and lets through only reads of
  # containers, /info, /version and /_ping; everything else is refused.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
