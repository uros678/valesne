# CI check: vet and test on every push and pull request, on Linux and
# Windows (the two supported systems; some failures show on one only), and
# on Linux arm64 (real ARM hardware, for the arm64 image).
# It builds and releases nothing. Commits that change only notes, docs or
# the personal files do not start it; a newer push cancels the older run.
# Tags are left to release.yml, which runs the same checks first.
name: CI

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
