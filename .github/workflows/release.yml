# Release: on a pushed tag v*, vet and test on Linux (amd64, arm64) and
# Windows, then build the static Linux binaries (amd64, arm64) and push the
# Docker image for both to ghcr.io/uros678/valesne, so users install with
# docker compose and compile nothing. Image tags for v0.4.1: 0.4.1, 0.4 and latest; a pre-release tag
# like v0.4.1-rc1 gets only 0.4.1-rc1.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The Dockerfile copies these binaries (no Go inside Docker, so no
      # emulation for arm64). The version is the tag, set explicitly so it
      # does not depend on the checkout.
      - run: |
          for arch in amd64 arm64; do
            GOARCH=$arch go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o valesne-linux-$arch .
          done
        env:
          CGO_ENABLED: '0'
          GOOS: linux
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # No build attestation: it shows on GHCR as extra "untagged"
          # versions that must not be deleted.
          provenance: false
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
